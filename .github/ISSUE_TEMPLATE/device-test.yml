name: 真机测试报告
description: 新流程（tools/tb710fu.py）在你的 TB710FU 上的测试结果，成功、失败、只跑到 check 都欢迎
title: "[真机测试] <原厂版本> → <小米版本>：<结果>"
labels: ["device-test"]
body:
  - type: markdown
    attributes:
      value: |
        先读 [测试指南](https://github.com/lich-wang/tb710fu-hyperos/blob/main/docs/testing.md)。
        **不要贴**：备份文件、刷机包、唯一数据分区的内容、密码。芯片序列号可以打码（保留前后几位）。
  - type: input
    id: stock
    attributes:
      label: 平板原厂系统版本
      description: 地区（CN / ROW）和版本号，例如 CN ZUXOS 1.5.04.495、ROW ZUI 17.5.04.059；刷过别的系统也写上
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: check 的输出
      description: "`python3 tools/tb710fu.py check` 的完整输出（从“==== 设备 ====”到结论）"
      render: text
    validations:
      required: true
  - type: dropdown
    id: reached
    attributes:
      label: 走到了哪一步
      options:
        - 只跑了 check
        - backup / pull / import
        - 构建（vendor → package）
        - flash --dry-run
        - flash 第一阶段
        - flash 第二阶段（after-setup）
        - restore
    validations:
      required: true
  - type: input
    id: inputs
    attributes:
      label: 构建输入
      description: 联想组件来自你的备份还是官方包（哪个版本）；小米 OTA 版本；有没有用 --no-verity / --force / --allow-debug
  - type: input
    id: host
    attributes:
      label: 电脑系统
      description: 例如 Ubuntu 24.04、macOS 26（Apple Silicon）；Python、erofs-utils、edl 的版本
  - type: dropdown
    id: boot
    attributes:
      label: 开机结果
      options:
        - 还没刷入
        - 进入开机向导 / 正常进系统
        - 卡在开机动画
        - 反复重启
        - 变成 900E（05C6:900E）
        - 黑屏没反应
        - 其他（下面说明）
  - type: checkboxes
    id: works
    attributes:
      label: 正常的功能（进了系统再填）
      options:
        - label: WiFi
        - label: 蓝牙
        - label: 触屏
        - label: 手写笔（书写 / 压感 / 按键）
        - label: 键盘
        - label: 摄像头（前 / 后）
        - label: 扬声器 / 麦克风 / 耳机
        - label: 充电和电量显示
        - label: 亮度、自动亮度、旋转等传感器
        - label: 120 Hz
        - label: USB 数据 / 网络共享
        - label: 小米账号登录（第二阶段之后）
        - label: 人脸解锁
  - type: textarea
    id: details
    attributes:
      label: 问题和报错
      description: 哪一步出错、原样的报错输出；不正常的功能是什么表现
      render: text
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 能进系统就附 `adb logcat -b all -d` 和 `adb shell dmesg`（作为附件拖进来）；900E 时附 edl 导出的 md_KBOOT_LOG.BIN
